          - list item "Times New Roman" (Family list)
          - list item "Verdana" (Family list)
          - *notepad_font
        want: {click: Consolas}
      - title: Settings - Notepad
        ui: *notepad_font
        want: done

  - goal: email this to my professor
    app: Notepad
    title: Essay draft - Notepad
    steps:
      - ui: [*notepad]
        want: ask

  # --- Calculator ------------------------------------------------------------------------------------------------
  - goal: switch to the scientific calculator
    app: Calculator
    title: Calculator
    steps:
      - ui: [*calculator]
        want: {click: Open Navigation}
      - ui: [*calculator_nav, *calculator]
        want: {click: Scientific Calculator}
      - ui: [*calculator]
        want: done

  - goal: work out 7 times 8
    app: Calculator
    title: Calculator
    steps:
      - ui: [*calculator]
        want: [{click: Seven}, {type: 7*8=}, {type: 7*8}]
      - ui: [*calculator]
        want: {click: Multiply by}
      - ui: [*calculator]
        want: {click: Eight}
      - ui: [*calculator]
        want: [{click: Equals}, {press: enter}]
      - ui: [*calculator]
        want: done

  - goal: print this
    app: Calculator
    title: Calculator
    steps:
      - ui: [*calculator]
        want: ask

