tasks:
  # --- Notepad ---------------------------------------------------------------------------------------------------
  - goal: turn on word wrap
    app: Notepad
    title: Untitled - Notepad
    steps:
      - ui: [*notepad]
        want: {click: View}
      - ui: [*notepad_view_menu, *notepad]
        want: {click: Word wrap}
      - ui: [*notepad]
        want: done

  - goal: make sure the status bar is showing
    app: Notepad
    title: Untitled - Notepad
    steps:
      - ui: [*notepad]
        want: {click: View}
      - ui: [*notepad_view_menu, *notepad]
        want: [done, {press: escape}]

  - goal: zoom in
    app: Notepad
    title: Untitled - Notepad
    steps:
      - ui: [*notepad]
        want: [{click: View}, {press: ctrl+plus}, {press: ctrl+=}]
      - ui: [*notepad_view_menu, *notepad]
        want: {click: Zoom}
      - ui:
          - menu item "Zoom in" (Zoom menu)
          - menu item "Zoom out" (Zoom menu)
          - menu item "Restore default zoom" (Zoom menu)
          - menu item "Zoom" open (View menu)
          - menu item "Status bar" on (View menu)
          - menu item "Word wrap" off (View menu)
          - *notepad
        want: {click: Zoom in}
      - ui: [*notepad]
        want: done

  - goal: find the word budget in this file
    app: Notepad
    title: Expenses - Notepad
    steps:
      - ui: [*notepad]
        want: [{click: Edit}, {press: ctrl+f}]
      - ui: [*notepad_edit_menu, *notepad]
        want: {click: Find}
      - ui:
          - edit "Find" (Find pane)
          - button "Find previous" (Find pane)
          - button "Find next" (Find pane)
          - button "Toggle replace" (Find pane)
          - button "Options" (Find pane)
          - button "Close" (Find pane)
          - *notepad
        want: {type: budget, into: Find}
      - ui:
          - edit "Find" (Find pane)
          - button "Find previous" (Find pane)
          - button "Find next" (Find pane)
          - button "Toggle replace" (Find pane)
          - button "Options" (Find pane)
          - button "Close" (Find pane)
          - *notepad
        want: [done, {press: enter}, {click: Find next}]

  - goal: save this as notes
    app: Notepad
    title: '*Untitled - Notepad'
    steps:
      - ui: [*notepad]
        want: [{click: File}, {press: ctrl+shift+s}]
      - ui: [*notepad_file_menu, *notepad]
        want: {click: Save as}
      - title: Save as
        ui: &save_as
          - edit "File name:"
          - combo box "Save as type:"
          - combo box "Encoding:"
          - button "Save"
          - button "Cancel"
          - button "Back"
          - button "Up"
          - edit "Search Documents"
          - button "New folder"
          - tree item "Home" (Navigation Pane tree)
          - tree item "Desktop" (Navigation Pane tree)
          - tree item "Downloads" (Navigation Pane tree)
          - tree item "Documents" (Navigation Pane tree)
          - tree item "Pictures" (Navigation Pane tree)
          - list item "Expenses.txt" (Items View list)
          - list item "todo.txt" (Items View list)
          - button "Hide Folders"
          - button "Close"
        want: [{type: notes, into: "File name:"}, {type: notes.txt, into: "File name:"}]
      - title: Save as
        ui: *save_as
        want: [{click: Save}, {press: enter}]
      - ui: [*notepad]
        want: done

  - goal: switch notepad to dark mode
    app: Notepad
    title: Untitled - Notepad
    steps:
      - ui: [*notepad]
        want: {click: Settings}
      - title: Settings - Notepad
        ui: [*notepad_settings]
        want: {click: App theme}
      - title: Settings - Notepad
        ui:
          - radio button "Light" off (App theme group)
          - radio button "Dark" off (App theme group)
          - radio button "Use system setting" on (App theme group)
          - *notepad_settings
        want: {click: Dark}
      - title: Settings - Notepad
        ui:
          - radio button "Light" off (App theme group)
          - radio button "Dark" on (App theme group)
          - radio button "Use system setting" off (App theme group)
          - *notepad_settings
        want: done

  - goal: change the font to consolas
    app: Notepad
    title: Untitled - Notepad
    steps:
      - ui: [*notepad]
        want: [{click: Edit}, {click: Settings}]
      - ui: [*notepad_edit_menu, *notepad]
        want: {click: Font}
      - title: Settings - Notepad
        ui: &notepad_font
          - combo box "Family" (Font group)
          - combo box "Style" (Font group)
          - combo box "Size" (Font group)
          - *notepad_settings
        want: [{click: Family}, {type: Consolas, into: Family}]
      - title: Settings - Notepad
        ui:
          - list item "Arial" (Family list)
          - list item "Calibri" (Family list)
          - list item "Cambria" (Family list)
          - list item "Comic Sans MS" (Family list)
          - list item "Consolas" (Family list)
