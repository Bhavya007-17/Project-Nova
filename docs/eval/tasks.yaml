# Task eval (Stage 07d): `nova eval --tasks` scores the task loop's pick, one step at a time (nova/task_eval.py).
#
# Each step is one look at the window in front: its rows exactly as `rows.lines` writes them for the model, minus the
# numbers (the loader numbers them in order, so an open menu's rows go in front of a screen kept under `screens:`),
# and what a right next step is. The model sees the goal, the rows and the labels of the wanted steps before it.
#
#   want: {click|right|double: <row name>, area: <its area, when two rows share the name>}
#         {type: <text>, into: <row name>}   {press: <keys>}   {scroll: up|down}   done   ask
#         or a list of these: any one is right.
#
# source: these rows are hand-built from Windows 11 / Chrome layouts, in the row format, not yet recorded. To record
# one: open a throwaway window in that state, `nova rows --dump --title "<its title>"`, paste the dump's `lines` here
# (numbers and all: they are renumbered) and set `source: recorded` on the task. Recording takes focus: ask first.
source: hand-built

