# Intent eval (SPEC §18) — run with `nova eval`. Synthetic paraphrases: varied phrasing, fillers,
# polite forms. Scored on the action and its key arguments, not exact strings.
#
# `want` (alternatives separated by " || ", steps by " ; "):
#   open NAME                 open_app / switch_app / open_url (NAME: an app, a short name or a domain)
#   close NAME                close_app
#   window OP[|OP] TARGET     TARGET: active or an app        layout APP:AREA, APP:AREA
#   search QUERY / search@ENGINE QUERY    type TEXT / type+enter TEXT    press KEYS
#   tab OP[|OP] · nav OP · scroll DIR [AMOUNT] · volume OP [LEVEL] · media OP[|OP]
#   dictation OP · listening OP · click · clarify · teach · handoff [claude|chatgpt]
# Negatives: conversation that must not cause an action (asking is fine, acting is not).
# Every item's screen: Chrome in front, these apps open (an item can set its own `front` / `open`).

