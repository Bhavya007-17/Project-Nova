[project]
name = "nova"
version = "0.0.0"
description = "Local voice layer for Windows: Dynamic-Island bar, hand-speed commands, dictation, handoff."
requires-python = ">=3.12,<3.13"
dependencies = [
    "jellyfish>=1.3",
    "numpy>=2.5",
    "nvidia-ml-py>=13.615",
    "onnx-asr>=0.12,<0.13",
    "onnxruntime>=1.31,<1.32",
    "pyside6-essentials>=6.12,<6.13",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14",
    "sherpa-onnx>=2.0.1,<2.1",
    "sounddevice>=0.5.6",
]

[project.scripts]
nova = "nova.cli:main"

[project.gui-scripts]
novaw = "nova.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["nova"]
# GUI shell and OS/model glue are checked by the live demo and `nova bench-stt`, not unit tests
# (CLAUDE.md: no tests that open windows or the mic): tray, app wiring, the WTS lock window,
# the Parakeet loader, console mode, the keyboard hook (Win32), the audio detectors (COM),
# the island's window (Win32 styles, placement, show / hide), the Windows actions (window moves, typing, volume,
# UI Automation: their pure parts - catalog, geometry, Tier 0, risk, executor - are tested), `nova say`.
omit = [
    "nova/tray.py", "nova/app.py", "nova/__main__.py", "nova/session.py", "nova/stt/parakeet.py", "nova/console.py",
    "nova/hook.py", "nova/detect.py", "nova/island/window.py",
    "nova/actions/native.py", "nova/actions/apps.py", "nova/actions/input.py", "nova/actions/uia.py",
    "nova/actions/system.py", "nova/actions/context.py", "nova/actions/hands.py", "nova/say.py",
    # `nova bench-llm`: drives real Ollama servers (checked by running it; its pick logic is tiny)
    "nova/bench_llm.py",
]
