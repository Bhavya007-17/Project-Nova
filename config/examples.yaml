# What people say -> what Nova does. General knowledge, shipped with Nova; add your own freely.
#
# Nova does not match these word for word. A small sentence model (models/embed, local, CPU) turns what
# you said into a vector and finds the nearest sentences here by meaning. When they clearly agree on one
# plan, Nova runs it at once (no LLM); otherwise the nearest ones are shown to the local LLM as worked
# examples. So a new phrasing works without being listed: these only need to cover the *ideas*.
#
#   do:    one step, or a list of steps (the actions of docs/SPEC.md §7.5)
#   kind:  handoff (to: claude | chatgpt; the prompt is what was said) | dictate | ignore (chat, not a command)
#   {app}  stands for whichever installed app the sentence names
#
# Rules: no sentence from docs/eval/intents.yaml (that file is the exam); nothing personal (your own
# short names live in aliases.yaml, and Nova learns your own phrasings into data/skills/).

